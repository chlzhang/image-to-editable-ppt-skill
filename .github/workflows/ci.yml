name: CI

on:
  pull_request:
    branches:
      - main
      - beta
  push:
    branches:
      - main
      - beta

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CLI package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e skills/image-to-editable-ppt/cli

      - name: Install preview test font
        shell: python
        run: |
          from pathlib import Path
          from urllib.request import urlretrieve
          # Fixed upstream font release; downloaded only during setup, before offline tests.
          path = Path.home() / ".local/share/fonts/NotoSansCJKsc-Regular.otf"
          path.parent.mkdir(parents=True, exist_ok=True)
          urlretrieve("https://raw.githubusercontent.com/notofonts/noto-cjk/Sans2.004/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf", path)

      - name: Check CLI help
        run: |
          editppt --help
          editppt image --help
          editppt run finalize --help
          editppt formula render-latex --help

      - name: Compile runtime Python files
        run: |
          python -m compileall -q skills/image-to-editable-ppt/cli/editppt tests

      - name: Run tests
        run: |
          python tests/run_offline.py

      - name: Check packaged skill hygiene
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files "skills/image-to-editable-ppt/**/.DS_Store" "skills/image-to-editable-ppt/**/__pycache__/*" "skills/image-to-editable-ppt/**/*.pyc" | grep .; then
            echo "Generated cache or OS metadata files must not be tracked in the packaged skill."
            exit 1
          fi
